const short = (s, n=45) => String(s||'').length>n?String(s).slice(0,n-1)+'…':String(s||'');

const DB_NAME='ayc_service_pro_v1';
function dbOpen(){return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(new Error('IndexedDB no disponible'));return;}
  const r=indexedDB.open(DB_NAME,3);
  r.onblocked=()=>{
    // No cerrar ni borrar la base de datos anterior: podría contener reportes reales.
    const main=$('#mainContent');
    if(main)main.innerHTML=`<section class="empty-state"><h3>La versión anterior sigue abierta</h3><p>La actualización necesita acceder a tus reportes guardados. Cierra las demás pestañas o ventanas de A&C Service Pro (versión 1.0), regresa a esta página y vuelve a abrirla. Tus reportes no se han borrado.</p><button class="btn btn-primary" data-action="retry-startup">Reintentar inicio</button></section>`;
  };
  r.onupgradeneeded=()=>{
    const d=r.result;
    if(!d.objectStoreNames.contains('reports'))d.createObjectStore('reports',{keyPath:'id'});
    if(!d.objectStoreNames.contains('prefs'))d.createObjectStore('prefs',{keyPath:'key'});
    if(!d.objectStoreNames.contains('quotes'))d.createObjectStore('quotes',{keyPath:'id'});
    if(!d.objectStoreNames.contains('inventory'))d.createObjectStore('inventory',{keyPath:'id'});
    for(const k of ['orders','appointments','staff'])if(!d.objectStoreNames.contains(k))d.createObjectStore(k,{keyPath:'id'});
  };
  r.onsuccess=()=>{
    r.result.onversionchange=()=>r.result.close();
    resolve(r.result);
  };
  r.onerror=()=>reject(r.error||new Error('Error al abrir la base de datos'));
});}
function tx(store,mode,fn){return new Promise((resolve,reject)=>{const t=state.db.transaction(store,mode);const s=t.objectStore(store);let val;let request;try{request=fn(s);}catch(e){reject(e);return;}if(request&&typeof request.onsuccess!=='undefined'){request.onsuccess=()=>{val=request.result;};request.onerror=()=>reject(request.error);}t.oncomplete=()=>resolve(val);t.onerror=()=>reject(t.error);});}
const STORE={
 async initialize(){try{state.db=await dbOpen();}catch(e){console.warn('Usando almacenamiento alternativo',e);state.db=null;}},
 async all(){if(state.db)return tx('reports','readonly',s=>s.getAll());try{return JSON.parse(localStorage.getItem('ayc_reports')||'[]');}catch{return[];}},
 async getPref(k){if(state.db)return (await tx('prefs','readonly',s=>s.get(k)))?.value;try{return JSON.parse(localStorage.getItem('ayc_pref_'+k)||'null');}catch{return null;}},
 async setPref(k,v){if(state.db)return tx('prefs','readwrite',s=>s.put({key:k,value:v}));localStorage.setItem('ayc_pref_'+k,JSON.stringify(v));},
 async put(r){if(state.db)return tx('reports','readwrite',s=>s.put(r));const a=await STORE.all();const i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.push(r);localStorage.setItem('ayc_reports',JSON.stringify(a));},
 async remove(id){if(state.db)return tx('reports','readwrite',s=>s.delete(id));const a=(await STORE.all()).filter(x=>x.id!==id);localStorage.setItem('ayc_reports',JSON.stringify(a));}
};

function dashboard(){setPage('dashboard','Panel de control');const n=state.reports.length,completed=state.reports.filter(r=>r.status==='completado').length,active=n-completed,clients=new Set(state.reports.map(r=>(r.clientName||'').toLowerCase().trim()).filter(Boolean)).size,revenue=state.reports.filter(r=>r.status==='completado').reduce((a,r)=>a+Number(r.price||0),0),unfinished=state.reports.find(r=>r.status!=='completado');$('#mainContent').innerHTML=`<section class="hero"><div class="hero-copy"><div class="overline">PLATAFORMA HVAC · VERSIÓN 3.0</div><h1>Tu trabajo habla.<br>La evidencia lo demuestra.</h1><p>Servicios organizados, fotografías, firma del cliente y reportes digitales profesionales en un solo lugar.</p><button class="btn btn-primary" data-action="new-report">${icon('plus')} Crear reporte de servicio</button></div><div class="hero-mark"><img src="${escape(state.company.logo||DEFAULT_ICON)}" alt="Aire Acondicionado y Confort"></div></section><section class="stat-grid"><div class="stat-card"><div class="stat-head">Total de servicios <span class="stat-icon">${icon('clipboard')}</span></div><strong class="mono">${n}</strong><small>Reportes registrados</small></div><div class="stat-card"><div class="stat-head">Completados <span class="stat-icon">${icon('check')}</span></div><strong class="mono">${completed}</strong><small>Servicios entregados</small></div><div class="stat-card"><div class="stat-head">En seguimiento <span class="stat-icon">${icon('activity')}</span></div><strong class="mono">${active}</strong><small>Pendientes / en proceso</small></div><div class="stat-card"><div class="stat-head">Importe completado <span class="stat-icon">${icon('wind')}</span></div><strong class="mono" style="font-size:clamp(20px,2.5vw,29px)">${money(revenue)}</strong><small>Ingresos registrados, no cobranzas</small></div></section><div class="quicklinks-v2"><button class="quicklink-v2" data-nav="quotes">${icon('clipboard')}<span><b>Cotizaciones</b><small>Presupuestos y PDF</small></span></button><button class="quicklink-v2" data-nav="inventory">${icon('wind')}<span><b>Inventario</b><small>Materiales y existencias</small></span></button><button class="quicklink-v2" data-nav="diagnostics">${icon('activity')}<span><b>Diagnóstico</b><small>Cálculos HVAC</small></span></button><button class="quicklink-v2" data-nav="equipment">${icon('search')}<span><b>Equipos</b><small>Historial por serie</small></span></button></div><div class="content-grid"><section class="panel"><div class="panel-head"><div><h2>Actividad reciente</h2><span class="panel-sub">Historial de mantenimientos y servicios</span></div><button data-nav="reports" class="btn btn-sm btn-ghost">Ver todos</button></div>${n?`<div class="list-stack">${state.reports.slice(0,5).map(recentItem).join('')}</div>`:empty('Sin reportes todavía','Crea tu primer servicio para empezar a construir el historial de tu negocio.','<button data-action="new-report" class="btn btn-primary">Crear primer reporte</button>')}</section><section class="panel"><div class="panel-head"><h2>Flujo de trabajo</h2><span class="badge blue">${clients} clientes</span></div><div class="quick-steps"><div class="step"><span class="step-num">01</span><div><strong>Captura la información</strong><p>Cliente, unidad, capacidad, refrigerante y datos de servicio.</p></div></div><div class="step"><span class="step-num">02</span><div><strong>Registra la evidencia</strong><p>Checklist, parámetros HVAC, fotografías y diagnóstico.</p></div></div><div class="step"><span class="step-num">03</span><div><strong>Entrega el reporte</strong><p>Firma digital y opción de imprimir o guardar como PDF.</p></div></div></div>${unfinished?`<div class="summary-sep"></div><div class="muted small">Tienes un reporte sin completar</div><div style="margin-top:10px"><button class="btn btn-sm" data-action="edit" data-id="${escape(unfinished.id)}">${icon('edit')} Continuar ${escape(unfinished.folio)}</button></div>`:''}</section></div>`;v3InjectDashboard(); function reportCard(r){return `<article class="report-card"><div class="report-card-top"><div><div class="overline">${escape(r.folio)}</div><small>${dateDisplay(r.date)}</small></div>${reportBadge(r.status)}</div><h3>${escape(r.clientName)}</h3><div class="equipment-line">${escape(r.equipmentType||'Equipo')} · ${escape(short([r.brand,r.capacity].filter(Boolean).join(' / ')||SERVICE_LABELS[r.serviceType]))}</div><div class="report-card-divider"></div><div class="card-detail"><span>Servicio</span><b>${escape(SERVICE_LABELS[r.serviceType]||'Otro')}</b></div><div class="card-detail"><span>Actividades</span><b>${countDone(r)} de ${(r.tasks||[]).length}</b></div><div class="card-detail"><span>Importe</span><b>${money(r.price)}</b></div><div class="report-card-actions"><button data-action="preview" data-id="${escape(r.id)}" class="btn btn-primary btn-sm">${icon('eye')} Ver</button><button data-action="edit" data-id="${escape(r.id)}" class="btn btn-sm">${icon('edit')} Editar</button><button data-action="delete" data-id="${escape(r.id)}" class="btn btn-danger btn-sm" aria-label="Eliminar reporte">${icon('trash')}</button></div></article>`;}
function filteredReports(){const q=state.search.toLowerCase().trim();return state.reports.filter(r=>(state.statusFilter==='todos'||r.status===state.statusFilter)&&(!q||[r.clientName,r.folio,r.equipmentType,r.brand,r.model,r.serial,r.clientPhone].some(v=>String(v||'').toLowerCase().includes(q))));}
function reportsPage(){setPage('reports','Reportes de servicio');$('#mainContent').innerHTML=heading('Reportes de servicio','Consulta, modifica, imprime y comparte tus trabajos.',`<button class="btn btn-primary" data-action="new-report">${icon('plus')} Nuevo reporte</button>`)+`<div class="search-row"><div class="search-input">${icon('search').replace('<svg','<svg class="search-icon"')}<input class="input" id="reportSearch" placeholder="Buscar por cliente, folio, equipo o serie…" value="${escape(state.search)}"></div><div class="tabs">${[['todos','Todos'],['completado','Terminados'],['en_proceso','En proceso'],['pendiente','Pendientes']].map(([v,l])=>`<button type="button" class="tab ${state.statusFilter===v?'active':''}" data-action="filter" data-filter="${v}">${l}</button>`).join('')}</div></div><div id="reportResults"></div>`;updateReportResults();}
function updateReportResults(){const r=filteredReports();$('#reportResults').innerHTML=r.length?`<div class="report-cards">${r.map(reportCard).join('')}</div>`:empty('No encontramos reportes','Prueba otra búsqueda o crea un nuevo reporte.',`<button class="btn btn-primary" data-action="new-report">${icon('plus')} Nuevo reporte</button>`);}
const field=(label,key,placeholder='',span='',type='text',value)=>`<div class="form-field ${span}"><label for="f-${key}">${label}</label><input class="input" id="f-${key}" data-field="${key}" type="${type}" placeholder="${escape(placeholder)}" value="${escape(value===undefined?state.draft[key]:value)}"></div>`;
const sel=(label,key,opts,span='')=>`<div class="form-field ${span}"><label for="f-${key}">${label}</label><select class="select" id="f-${key}" data-field="${key}">${opts.map(([v,l])=>`<option value="${escape(v)}" ${state.draft[key]===v?'selected':''}>${escape(l)}</option>`).join('')}</select></div>`;
const metric=(label,key,placeholder='',unit='')=>`<div class="form-field"><label for="m-${key}">${label}${unit?` <span class="muted">(${unit})</span>`:''}</label><input class="input" type="number" step="any" inputmode="decimal" placeholder="${escape(placeholder)}" data-metric="${key}" id="m-${key}" value="${escape(state.draft.measurements?.[key]||'')}"></div>`;
const group=(name,iconName,subtitle,contents)=>`<section class="form-section"><div class="form-section-head"><span class="form-icon">${icon(iconName)}</span><div><h2>${name}</h2><p>${subtitle}</p></div></div>${contents}</section>`;
function checklistHTML(){const a=state.draft.tasks||[],done=a.filter(t=>t.done).length;return `<div class="check-toolbar"><span class="badge blue" id="taskCount">${done} de ${a.length} realizadas</span><button data-action="complete-tasks" class="btn btn-sm btn-ghost">${icon('check')} Marcar todas</button></div><div class="progress-track"><div style="width:${a.length?Math.round(100*done/a.length):0}%"></div></div><div class="checklist">${a.map((t,i)=>`<div class="check-item"><label><input type="checkbox" data-check="${i}" ${t.done?'checked':''}><span>${escape(t.label)}</span></label><button data-action="remove-task" data-index="${i}" type="button" aria-label="Quitar actividad">×</button></div>`).join('')}</div><div class="check-add"><input class="input" id="customCheckInput" placeholder="Agregar otra actividad…" maxlength="100"><button data-action="add-task" class="btn btn-sm" type="button">${icon('plus')} Añadir</button></div>`;}
function photosHTML(){const a=state.draft.photos||[];return `<p class="muted small">Agrega hasta 6 fotografías. Se comprimen para ahorrar espacio y se guardan en el dispositivo.</p><div class="photo-grid">${a.map((p,i)=>`<div class="photo-tile"><img src="${escape(p.data)}" alt="Evidencia ${i+1}"><button class="photo-remove" type="button" data-action="remove-photo" data-index="${i}" aria-label="Quitar fotografía">×</button><input class="input photo-caption-input" data-photocaption="${i}" type="text" maxlength="70" aria-label="Descripción de foto ${i+1}" placeholder="Descripción de evidencia" value="${escape(p.caption||`Evidencia ${i+1}`)}"></div>`).join('')}${a.length<6?`<label class="photo-upload" for="photosInput">${icon('camera')}<strong>Agregar fotos</strong><small>Antes / durante / después</small></label>`:''}</div><input type="file" accept="image/*" multiple id="photosInput" class="hide"><div class="inline-alert">${a.length} / 6 fotografías agregadas</div>`;}
function deltaT(r){const m=r.measurements||{};const ret=Number(m.returnTemp),supply=Number(m.supplyTemp);return m.returnTemp!==''&&m.returnTemp!=null&&m.supplyTemp!==''&&m.supplyTemp!=null&&Number.isFinite(ret-supply)?(ret-supply).toFixed(1):null;}
function editor(preserve=false){if(!preserve&&!state.draft)state.draft=blankReport();setPage('editor',state.draft?.updatedAt?'Editar reporte':'Nuevo reporte');const d=state.draft;$('#mainContent').innerHTML=heading(d.updatedAt?'Editar reporte':'Nuevo reporte',`Folio ${escape(d.folio)} · El borrador se guarda automáticamente en este dispositivo.`,`<button class="btn btn-ghost" data-action="cancel-editor">${icon('home')} Salir</button>`)+`<div class="editor-layout"><div class="editor-main">${group('Información del servicio','clipboard','Información general y cliente',`<div class="form-grid">${field('Nombre del cliente *','clientName','Nombre completo / empresa','full')}${field('WhatsApp / teléfono','clientPhone','33 0000 0000','', 'tel')}${field('Fecha del servicio','date','','','date')}${field('Domicilio de servicio','clientAddress','Calle, número, municipio','full')}${sel('Tipo de servicio','serviceType',Object.entries(SERVICE_LABELS))}${sel('Estado del reporte','status',[['pendiente','Pendiente'],['en_proceso','En proceso'],['completado','Completado']])}${field('Técnico responsable','technician','Nombre del técnico','full')}</div>`)}${group('Datos del equipo','wind','Ficha técnica para rastreabilidad',`<div class="form-grid">${sel('Tipo de equipo','equipmentType',[['Minisplit','Minisplit'],['Paquete / Rooftop','Paquete / Rooftop'],['Unidad manejadora','Unidad manejadora'],['Fan & Coil','Fan & Coil'],['Cámara de refrigeración','Cámara de refrigeración'],['Condensadora','Condensadora'],['Chiller','Chiller'],['Otro','Otro']])}${field('Marca','brand','Carrier, York, Mirage…')}${field('Modelo','model','Modelo de fábrica')}${field('Capacidad','capacity','1 TR / 12,000 BTU/h')}${field('Refrigerante','refrigerant','R410A / R22 / R32…')}${field('Número de serie','serial','Serie del equipo')}${field('Ubicación del equipo','location','Azotea, oficina, local…','full')}</div>`)}${group('Actividades realizadas','check','Marca las verificaciones que sí ejecutaste',`<div id="checklistHolder">${checklistHTML()}</div>`)}${group('Mediciones HVAC','activity','Registra valores reales; no se estiman automáticamente',`<div class="form-grid three">${metric('Voltaje','voltage','220','V')}${metric('Corriente','current','8.5','A')}${metric('Succión','suction','120','psig')}${metric('Descarga / alta','discharge','360','psig')}${metric('Temp. retorno','returnTemp','27','°C')}${metric('Temp. suministro','supplyTemp','15','°C')}${metric('Sobrecalentamiento','superheat','8','°C')}${metric('Subenfriamiento','subcooling','5','°C')}</div><div class="tip-box" style="margin-top:15px"><strong>ΔT aire (retorno − suministro): <span id="deltaBadge">${deltaT(d)??'—'}${deltaT(d)!==null?' °C':''}</span></strong><br>Resultado informativo; interpreta según equipo, modo, condiciones y método de medición.</div>`)}${group('Evidencia fotográfica','camera','Respaldo visible del trabajo realizado',`<div id="photosHolder">${photosHTML()}</div>`)}${group('Diagnóstico y recomendaciones','file','Información para entregar al cliente',`<div class="form-grid">${sel('Estado final del equipo','condition',Object.entries(CONDITION_LABELS),'full')}<div class="form-field full"><label>Observaciones / trabajo realizado</label><textarea data-field="observations" class="textarea" placeholder="Describe diagnóstico, acciones y resultados...">${escape(d.observations)}</textarea></div><div class="form-field full"><label>Recomendaciones al cliente</label><textarea data-field="recommendations" class="textarea" placeholder="Reparación sugerida, piezas, seguimiento...">${escape(d.recommendations)}</textarea></div>${field('Importe del servicio (MXN)','price','0.00','','number')}${sel('Forma de pago','payment',[['No especificado','No especificado'],['Efectivo','Efectivo'],['Transferencia','Transferencia'],['Tarjeta','Tarjeta'],['Pendiente','Pendiente']])}${field('Próximo mantenimiento','nextService','','full','date')}</div>`)}${group('Firma de conformidad','edit','Firma opcional del cliente directamente en pantalla',`<div class="signature-pad"><canvas id="signatureCanvas" width="780" height="190" aria-label="Área para firmar con el dedo"></canvas></div><div class="signature-footer"><span>Dibuja con tu dedo o un lápiz táctil.</span><button data-action="clear-signature" class="btn btn-sm btn-ghost">Borrar firma</button></div>`)}<div class="field-end"><button class="btn btn-ghost" data-action="save-draft">${icon('save')} Guardar borrador</button><button class="btn btn-primary" data-action="save-report">${icon('check')} Guardar reporte</button></div></div><aside class="side-summary"><div class="summary-box"><div class="overline">RESUMEN EN VIVO</div><h3>${escape(d.folio)}</h3><div class="summary-row"><span>Cliente</span><strong id="sumClient">${escape(short(d.clientName||'Sin asignar',24))}</strong></div><div class="summary-row"><span>Servicio</span><strong id="sumType">${escape(SERVICE_LABELS[d.serviceType])}</strong></div><div class="summary-row"><span>Equipo</span><strong id="sumEquipment">${escape(d.equipmentType)}</strong></div><div class="summary-row"><span>Actividades</span><strong id="sumTasks">${countDone(d)} / ${d.tasks.length}</strong></div><div class="summary-row"><span>Fotografías</span><strong id="sumPhotos">${d.photos.length} / 6</strong></div><div class="summary-sep"></div><div class="summary-row"><span>Importe</span><strong id="sumPrice" style="color:#6fe7bb">${money(d.price)}</strong></div></div><div class="side-actions"><button class="btn btn-primary" data-action="save-report">${icon('save')} Guardar reporte</button><button class="btn btn-ghost" data-action="save-draft">${icon('clipboard')} Guardar borrador</button></div><p class="muted small" style="margin-top:15px">Los datos permanecen en este teléfono o navegador hasta que los exportes o borres.</p></aside></div>`;initializeSignature();}
function refreshSummary(){const d=state.draft;if(!d||state.page!=='editor')return;const set=(id,v)=>{const el=$('#'+id);if(el)el.textContent=v;};set('sumClient',short(d.clientName||'Sin asignar',24));set('sumType',SERVICE_LABELS[d.serviceType]||'Servicio');set('sumEquipment',d.equipmentType);set('sumTasks',`${countDone(d)} / ${(d.tasks||[]).length}`);set('sumPhotos',`${(d.photos||[]).length} / 6`);set('sumPrice',money(d.price));set('deltaBadge',deltaT(d)===null?'—':`${deltaT(d)} °C`);}
function initializeSignature(){const c=$('#signatureCanvas');if(!c)return;const ctx=c.getContext('2d');ctx.lineWidth=2.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#164e8c';if(state.draft.signature){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,c.width,c.height);img.src=state.draft.signature;}let down=false,last=null;const pos=e=>{const b=c.getBoundingClientRect();return {x:(e.clientX-b.left)*c.width/b.width,y:(e.clientY-b.top)*c.height/b.height};};c.addEventListener('pointerdown',e=>{down=true;last=pos(e);c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y+.1);ctx.stroke();});c.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});const finish=()=>{if(!down)return;down=false;state.draft.signature=c.toDataURL('image/png');scheduleDraft();};c.addEventListener('pointerup',finish);c.addEventListener('pointercancel',finish);}
async function saveReport(complete=false){const d=state.draft;if(!d)return;if(!d.clientName.trim()){toast('Escribe el nombre del cliente antes de guardar.');$('#f-clientName')?.focus();return;}try{d.updatedAt=new Date().toISOString();if(complete)d.status='completado';await STORE.put(d);state.reports=await STORE.all();sortReports();await STORE.setPref('draft',null);state.draft=null;state.selectedId=d.id;toast('Reporte guardado correctamente.');preview();}catch(e){console.error(e);toast('No se pudo guardar: revisa el espacio del dispositivo.');}}
function clientsPage(){setPage('clients','Clientes');const map=new Map();for(const r of [...state.reports].reverse()){const key=(r.clientName||'').trim().toLowerCase();if(!key)continue;const c=map.get(key)||{name:r.clientName,phone:'',address:'',count:0,last:r.date};c.count++;c.phone=r.clientPhone||c.phone;c.address=r.clientAddress||c.address;c.last=r.date||c.last;map.set(key,c);}const customers=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'es'));const q=state.clientSearch.toLowerCase().trim();const list=customers.filter(c=>[c.name,c.phone,c.address].some(x=>String(x).toLowerCase().includes(q)));$('#mainContent').innerHTML=heading('Cartera de clientes',`${customers.length} clientes creados automáticamente a partir de tus reportes.`,`<button data-action="new-report" class="btn btn-primary">${icon('plus')} Nuevo servicio</button>`)+`<div class="search-row"><div class="search-input">${icon('search').replace('<svg','<svg class="search-icon"')}<input class="input" id="clientSearch" placeholder="Buscar cliente o teléfono..." value="${escape(state.clientSearch)}"></div></div><div id="clientResults">${list.length?`<div class="client-grid">${list.map(c=>`<article class="client-card"><div class="client-avatar">${escape(initials(c.name))}</div><h3>${escape(c.name)}</h3><p>${escape(c.phone||'Sin teléfono')}</p><p>${escape(short(c.address||'Sin dirección',80))}</p><p><strong>${c.count}</strong> servicio(s) · Último: ${dateDisplay(c.last)}</p><button class="btn" data-action="new-for-client" data-client="${escape(c.name.toLowerCase())}">${icon('plus')} Nuevo servicio</button></article>`).join('')}</div>`:empty('Sin clientes todavía','Los clientes aparecen cuando guardas un primer servicio.')}</div>`;state.clientMap=map;}
function settingsPage(){setPage('settings','Configuración');const c=state.company;const sf=(label,key,placeholder='',type='text')=>`<div class="form-field"><label>${label}</label><input class="input" data-setting="${key}" type="${type}" value="${escape(c[key]||'')}" placeholder="${escape(placeholder)}"></div>`;$('#mainContent').innerHTML=heading('Configuración del negocio','Personaliza el encabezado, contacto y técnico de tus reportes.')+`<div class="settings-layout"><div>${group('Identidad de tu empresa','settings','Los cambios se aplican a los nuevos reportes y a su impresión',`<div class="form-grid">${sf('Nombre comercial','name')}${sf('Eslogan','tagline')}${sf('WhatsApp principal','phone')}${sf('Teléfono alternativo','phone2')}${sf('Técnico predeterminado','technician')}${sf('Sitio web','website')}</div><div class="field-end"><button class="btn btn-primary" data-action="save-settings">${icon('save')} Guardar configuración</button></div>`)}${group('Tu logotipo','camera','Puedes sustituir el logo provisional por el original de tu negocio',`<div class="mini-line"><img id="settingsLogo" src="${escape(c.logo||DEFAULT_ICON)}" class="setting-logo" alt="Logotipo del negocio"><div><label class="btn" for="logoInput">${icon('upload')} Subir logo</label><input class="hide" id="logoInput" type="file" accept="image/*"><p class="muted small" style="margin-top:9px">Recomendado: PNG cuadrado, fondo transparente.</p><button class="btn btn-sm btn-ghost" data-action="reset-logo">Usar logo provisional</button></div></div>`)} </div><aside><section class="panel"><h2 style="margin-bottom:14px">Tus datos</h2><p class="muted small">La app no envía datos a servidores. Respalda periódicamente fotos, reportes y configuración.</p><div class="settings-actions"><button class="btn" data-action="backup">${icon('download')} Exportar respaldo JSON</button><label for="importInput" class="btn" style="cursor:pointer">${icon('upload')} Importar respaldo JSON</label><input id="importInput" type="file" accept="application/json,.json" class="hide"><button class="btn" data-action="csv">${icon('download')} Exportar lista CSV</button></div><div class="summary-sep"></div><div class="tip-box"><strong>Instalar en Android</strong><br>Si la publicas en GitHub Pages (HTTPS), ábrela en Chrome y elige «Agregar a pantalla principal» o «Instalar aplicación».</div></section></aside></div>`;}
function sheetField(label,val){return `<div class="sheet-field"><b>${escape(label)}</b><span>${escape(val||'—')}</span></div>`;}
function reportHTML(r){const c=state.company,m=r.measurements||{},measure=[['Voltaje',m.voltage,'V'],['Corriente',m.current,'A'],['Presión succión',m.suction,'psig'],['Presión descarga',m.discharge,'psig'],['Temp. retorno',m.returnTemp,'°C'],['Temp. suministro',m.supplyTemp,'°C'],['Sobrecalentamiento',m.superheat,'°C'],['Subenfriamiento',m.subcooling,'°C'],['ΔT aire',deltaT(r),'°C']].filter(row=>row[1]!==''&&row[1]!==null&&row[1]!==undefined);const status=r.status==='completado'?'Completado':r.status==='pendiente'?'Pendiente':'En proceso';return `<article class="sheet"><header class="sheet-head"><div class="sheet-brand"><img class="sheet-logo" src="${escape(c.logo||DEFAULT_ICON)}" alt="Logo"><div><strong>${escape(c.name)}</strong><span>${escape(c.tagline)}</span></div></div><div class="sheet-report-meta"><h2>REPORTE TÉCNICO</h2><div>${escape(r.folio)}</div><p>Fecha: ${dateDisplay(r.date)}</p></div></header><div class="sheet-header-note"><span class="sheet-kicker">${escape(SERVICE_LABELS[r.serviceType]||'SERVICIO HVAC')}</span><span class="sheet-status ${r.status==='completado'?'':'progress'}">✓ ${status}</span></div><section class="sheet-section"><h3>01. Información del cliente</h3><div class="sheet-details">${sheetField('Cliente / empresa',r.clientName)}${sheetField('WhatsApp / teléfono',r.clientPhone)}${sheetField('Domicilio',r.clientAddress)}${sheetField('Técnico responsable',r.technician)}</div></section><section class="sheet-section"><h3>02. Identificación del equipo</h3><div class="sheet-details">${sheetField('Equipo',r.equipmentType)}${sheetField('Marca',r.brand)}${sheetField('Modelo',r.model)}${sheetField('Capacidad',r.capacity)}${sheetField('Refrigerante',r.refrigerant)}${sheetField('Número de serie',r.serial)}${sheetField('Ubicación',r.location)}</div></section><section class="sheet-section"><h3>03. Actividades del servicio</h3><div class="sheet-checks">${(r.tasks||[]).map(t=>`<div class="sheet-check"><span class="${t.done?'done':'no'}">${t.done?'☑':'☐'}</span><span>${escape(t.label)}</span></div>`).join('')||'<p>No se registraron actividades.</p>'}</div></section>${measure.length?`<section class="sheet-section"><h3>04. Mediciones registradas</h3><table class="sheet-table"><thead><tr><th>Parámetro</th><th>Valor</th><th>Parámetro</th><th>Valor</th></tr></thead><tbody>${Array.from({length:Math.ceil(measure.length/2)},(_,i)=>{const a=measure[i*2],b=measure[i*2+1];return `<tr><td>${escape(a[0])}</td><td>${escape(a[1])} ${escape(a[2])}</td><td>${b?escape(b[0]):''}</td><td>${b?`${escape(b[1])} ${escape(b[2])}`:''}</td></tr>`;}).join('')}</tbody></table></section>`:''}<section class="sheet-section"><h3>05. Estado del equipo</h3><div class="sheet-condition">${Object.entries(CONDITION_LABELS).map(([v,l])=>`<span class="${r.condition===v?'selected':''}">${escape(l)}</span>`).join('')}</div></section>${(r.photos||[]).length?`<section class="sheet-section"><h3>06. Evidencia fotográfica</h3><div class="sheet-photos">${r.photos.map((p,i)=>`<div class="sheet-photo"><img src="${escape(p.data)}" alt="Foto ${i+1}"><div>${escape(p.caption||`Evidencia ${i+1}`)}</div></div>`).join('')}</div></section>`:''}<section class="sheet-section"><h3>07. Observaciones y recomendaciones</h3><b style="font-size:10px;color:#5c7b94">TRABAJO REALIZADO / OBSERVACIONES</b><div class="sheet-notes">${escape(r.observations||'Sin observaciones adicionales.')}</div><b style="font-size:10px;color:#5c7b94;display:block;margin-top:9px">RECOMENDACIONES</b><div class="sheet-notes">${escape(r.recommendations||'Sin recomendaciones adicionales.')}</div>${r.nextService?`<div class="sheet-notes" style="margin-top:6px"><strong>Próximo mantenimiento:</strong> ${dateDisplay(r.nextService)}</div>`:''}</section><section class="sheet-section"><h3>08. Cierre del servicio</h3><div class="sheet-sign-row"><div><div class="sheet-price">Total registrado: ${money(r.price)}</div><div class="small" style="color:#71869a">Forma de pago: ${escape(r.payment||'No especificado')}</div></div><div class="sheet-signature">${r.signature?`<img src="${escape(r.signature)}" alt="Firma de conformidad">`:''}Firma de conformidad / cliente</div></div></section><footer class="sheet-footer">${escape(c.name)} · ${escape(c.tagline)}<div>WhatsApp: ${escape([c.phone,c.phone2].filter(Boolean).join(' / '))} ${c.website?' · '+escape(c.website):''}</div><div>Documento generado digitalmente · ${escape(r.folio)}</div></footer></article>`;}
function preview(){const r=state.reports.find(r=>r.id===state.selectedId);if(!r){reportsPage();return;}setPage('preview','Vista de reporte');$('#mainContent').innerHTML=`<div class="preview-toolbar"><div class="section-actions"><button class="btn btn-ghost" data-nav="reports">← Regresar</button><button class="btn" data-action="edit" data-id="${escape(r.id)}">${icon('edit')} Editar</button></div><div class="section-actions"><button class="btn btn-ghost" data-action="share" data-id="${escape(r.id)}">${icon('share')} WhatsApp</button><button class="btn btn-primary" data-action="print" data-id="${escape(r.id)}">${icon('printer')} Imprimir / Guardar PDF</button></div></div><div class="preview-outer">${reportHTML(r)}</div><p class="muted small" style="text-align:center;margin-top:13px">En Android, elige «Guardar como PDF» en las opciones de impresión. El envío por WhatsApp comparte un resumen; el PDF se adjunta aparte.</p>`;}
async function printReport(id){const r=state.reports.find(x=>x.id===id);if(!r)return;$('#printArea').innerHTML=reportHTML(r);const images=$$('img',$('#printArea'));try{await Promise.all(images.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;setTimeout(resolve,1600);})));}catch{}window.print();}
function downloadFile(filename,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}

async function importBackup(file){if(!file)return;try{const o=JSON.parse(await file.text());if(!o||!Array.isArray(o.reports)||o.app!=='A&C Service Pro')throw new Error('Formato de respaldo no válido');if(!confirm(`Importar ${o.reports.length} reportes? Se actualizarán los que tengan el mismo ID. Confirma que este archivo sea tuyo y de confianza.`))return;let added=0;for(const r of o.reports){if(!r.id||!r.folio||!Array.isArray(r.tasks)||!Array.isArray(r.photos))continue;await STORE.put(r);added++;}if(Array.isArray(o.quotes)){for(const q of o.quotes){if(q.id&&Array.isArray(q.items)&&typeof q.clientName==='string')await newRecordPut('quotes',q);}}if(Array.isArray(o.inventory)){for(const it of o.inventory){if(it.id&&typeof it.name==='string')await newRecordPut('inventory',it);}}for(const key of V3_KEYS){if(Array.isArray(o[key]))for(const rec of o[key].slice(0,5000)){if(rec&&typeof rec.id==='string'&&rec.id.length<160&&((key==='staff'&&typeof rec.name==='string')||(key!=='staff'&&typeof rec.clientName==='string'))){await newRecordPut(key,rec);}}}await v3Load();state.quotes=await newRecordAll('quotes');state.inventory=await newRecordAll('inventory');if(o.company&&typeof o.company==='object'){state.company={...DEFAULT_COMPANY,...o.company};await STORE.setPref('company',state.company);}state.reports=await STORE.all();sortReports();toast(`${added} reportes importados correctamente.`);dashboard();}catch(e){console.error(e);toast('No se pudo importar: respaldo inválido o sin espacio.');}}
function compressImage(file,max=1200,quality=.72){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/')){reject(new Error('Archivo no es imagen'));return;}const u=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(u);const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality));};img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('No se pudo leer la imagen'));};img.src=u;});}
async function addPhotos(files){if(!files?.length)return;let added=0;for(const f of Array.from(files).slice(0,6-state.draft.photos.length)){try{const data=await compressImage(f);const caption=state.draft.photos.length===0?'Antes del servicio':state.draft.photos.length===1?'Durante el servicio':'Después / evidencia';state.draft.photos.push({id:uid(),data,caption});added++;}catch(e){console.warn(e);}}$('#photosHolder').innerHTML=photosHTML();refreshSummary();scheduleDraft();toast(`${added} fotografía(s) agregada(s).`);}
async function startNew(prefill={}){if(state.draft&&Object.keys(state.draft).length){if(!confirm('¿Crear otro reporte? Se reemplazará el borrador actual.'))return;}state.draft=blankReport(prefill);scheduleDraft();editor(true);}
function openEditor(id){const r=state.reports.find(r=>r.id===id);if(!r)return;state.draft=JSON.parse(JSON.stringify(r));state.draft.tasks||=[];state.draft.photos||=[];state.draft.measurements||={};scheduleDraft();editor(true);}
// Módulos 2.0: conservan la base IndexedDB de 1.0 y añaden colecciones nuevas.
const COLLECTIONS=['quotes','inventory','orders','appointments','staff'];
async function newRecordAll(kind){if(!COLLECTIONS.includes(kind))throw Error('Colección no permitida');if(state.db)return await tx(kind,'readonly',s=>s.getAll());try{return JSON.parse(localStorage.getItem('ayc_v2_'+kind)||'[]');}catch{return [];}}
async function newRecordPut(kind,record){if(!COLLECTIONS.includes(kind))throw Error('Colección no permitida');if(state.db)return await tx(kind,'readwrite',s=>s.put(record));const all=await newRecordAll(kind),i=all.findIndex(r=>r.id===record.id);if(i<0)all.push(record);else all[i]=record;localStorage.setItem('ayc_v2_'+kind,JSON.stringify(all));}
async function newRecordDel(kind,id){if(!COLLECTIONS.includes(kind))throw Error('Colección no permitida');if(state.db)return await tx(kind,'readwrite',s=>s.delete(id));const all=(await newRecordAll(kind)).filter(x=>x.id!==id);localStorage.setItem('ayc_v2_'+kind,JSON.stringify(all));}

function quoteDefaults(){const n=Math.max(0,...state.quotes.map(q=>Number(String(q.folio||'').match(/(\d+)$/)?.[1])||0))+1;return {id:uid(),folio:`COT-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`,date:nowLocal(),validDays:15,clientName:'',clientPhone:'',clientAddress:'',subject:'Servicio HVAC',description:'',items:[{id:uid(),name:'Servicio técnico',qty:1,unit:'servicio',price:0}],discount:0,taxRate:0,notes:'Cotización válida durante 15 días naturales. Sujeto a disponibilidad y condiciones de instalación.',status:'borrador',createdAt:new Date().toISOString(),updatedAt:''};}
const quoteStatus={borrador:'Borrador',enviada:'Enviada',aprobada:'Aprobada',rechazada:'Rechazada'};
function quoteTotals(q){const sub=(q.items||[]).reduce((v,x)=>v+Math.max(0,Number(x.qty)||0)*Math.max(0,Number(x.price)||0),0),discount=Math.min(sub,Math.max(0,Number(q.discount)||0)),taxable=sub-discount,rate=Math.max(0,Math.min(100,Number(q.taxRate)||0)),tax=taxable*rate/100;return {subtotal:sub,discount,tax,total:taxable+tax};}
function quoteExpiry(q){const d=new Date(String(q.date||nowLocal())+'T12:00:00');if(Number.isNaN(d.getTime()))return '—';d.setDate(d.getDate()+Math.max(0,Math.min(365,Number(q.validDays)||0)));return nowISOFromDate(d);}
function nowISOFromDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

 'no-enfria':{title:'No enfría o enfría poco',steps:['Confirmar modo, consigna y velocidad de ventilación','Inspeccionar filtros, serpentines y flujo de aire','Medir voltaje, corriente y temperaturas de retorno/suministro','Verificar ventiladores, compresor y comportamiento de arranque','Si procede, revisar presiones y temperaturas de saturación conforme al refrigerante y condiciones reales','Revisar fugas y funcionamiento del dispositivo de expansión antes de concluir falta de refrigerante']},

function diagnosticsPage(){setPage('diagnostics','Diagnóstico HVAC');const d=state.diag;const inp=(lbl,key,ph)=>`<div class="form-field"><label>${lbl}</label><input class="input" type="number" step="any" inputmode="decimal" data-diag-field="${key}" placeholder="${ph}" value="${escape(d[key]??'')}"></div>`;$('#mainContent').innerHTML=heading('Diagnóstico y calculadoras','Herramientas rápidas de apoyo: utiliza únicamente mediciones reales.')+`<div class="content-grid"><section>${group('Temperaturas HVAC','activity','En modo enfriamiento, ΔT aire = retorno − suministro',`<div class="form-grid">${inp('Aire de retorno (°C)','return','27')}${inp('Aire de suministro (°C)','supply','15')}${inp('Temperatura línea succión (°C)','suctionLine','12')}${inp('Temperatura saturación evaporación (°C)','evapSat','4')}${inp('Temperatura saturación condensación (°C)','condSat','40')}${inp('Temperatura línea líquido (°C)','liquidLine','35')}</div>`)}${group('Capacidad y electricidad','wind','Conversiones informativas, sin supuestos de factor de potencia',`<div class="form-grid">${inp('Capacidad (BTU/h)','btu','12000')}${inp('Voltaje RMS (V)','voltage','220')}${inp('Corriente RMS (A)','current','8')}${inp('Factor de potencia (0–1)','pf','0.90')}</div>`)}${group('Guía de revisión','clipboard','Lista de verificación orientativa; no emite un diagnóstico automático',`<div class="form-field"><label>Selecciona el síntoma</label><select class="select" id="diagSymptom">${Object.entries(DIAG_STEPS).map(([k,v])=>`<option value="${k}" ${(d.symptom||'no-enfria')===k?'selected':''}>${escape(v.title)}</option>`).join('')}</select></div><div id="diagSteps"></div><div class="field-end"><button class="btn" data-action="diag-to-report">${icon('plus')} Crear reporte con estas lecturas</button></div>`)}</section><aside><div class="panel"><div class="overline">RESULTADOS</div><div id="diagResults" class="diag-results"></div><p class="muted small">No se asignan presiones de operación ni límites normales automáticamente. Consulta manual del fabricante, refrigerante y condiciones de carga antes de intervenir.</p></div><div class="note-strip">${icon('info')} Seguridad: trabajos eléctricos y de refrigeración presurizada requieren personal capacitado, aislamiento eléctrico y equipo de protección adecuado.</div></aside></div>`;diagRender();}
function validNum(v){return v!==''&&v!==undefined&&v!==null&&Number.isFinite(Number(v));}
function diagRender(){const d=state.diag,fmt=n=>Number(n).toFixed(1),out=[];if(validNum(d.return)&&validNum(d.supply))out.push(['ΔT de aire (frío)',fmt(Number(d.return)-Number(d.supply))+' °C']);if(validNum(d.suctionLine)&&validNum(d.evapSat))out.push(['Sobrecalentamiento',fmt(Number(d.suctionLine)-Number(d.evapSat))+' K']);if(validNum(d.condSat)&&validNum(d.liquidLine))out.push(['Subenfriamiento',fmt(Number(d.condSat)-Number(d.liquidLine))+' K']);if(validNum(d.btu)&&Number(d.btu)>=0){out.push(['Capacidad frigorífica',fmt(Number(d.btu)/12000)+' TR']);out.push(['Capacidad equivalente',fmt(Number(d.btu)*0.00029307107)+' kW']);}if(validNum(d.voltage)&&validNum(d.current)&&Number(d.voltage)>=0&&Number(d.current)>=0){out.push(['Potencia aparente (monofásica)',fmt(Number(d.voltage)*Number(d.current)/1000)+' kVA']);if(validNum(d.pf)&&Number(d.pf)>=0&&Number(d.pf)<=1)out.push(['Potencia activa estimada (monofásica)',fmt(Number(d.voltage)*Number(d.current)*Number(d.pf)/1000)+' kW']);}const el=$('#diagResults');if(el)el.innerHTML=out.length?out.map(([a,b])=>`<div class="diag-result"><small>${escape(a)}</small><strong>${escape(b)}</strong></div>`).join(''):'<p class="muted small">Introduce valores para calcular.</p>';const s=DIAG_STEPS[d.symptom||'no-enfria']||DIAG_STEPS['no-enfria'],steps=$('#diagSteps');if(steps)steps.innerHTML=`<h3>${escape(s.title)}</h3><ol class="diag-checks">${s.steps.map(t=>`<li>${escape(t)}</li>`).join('')}</ol>`;}

function v3AnalyticsPage(){setPage('analytics','Indicadores');const completed=state.reports.filter(r=>r.status==='completado');const tot=completed.reduce((v,r)=>v+(Number(r.price)||0),0);const orderForecast=state.orders.filter(o=>!['cancelada','finalizada'].includes(o.status)).reduce((v,o)=>v+(Number(o.amount)||0),0);const groups=[];const now=new Date();for(let i=5;i>=0;i--){const dt=new Date(now.getFullYear(),now.getMonth()-i,1),key=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;groups.push({label:new Intl.DateTimeFormat('es-MX',{month:'short'}).format(dt),key,total:completed.filter(r=>String(r.date||'').startsWith(key)).reduce((v,r)=>v+(Number(r.price)||0),0)});}const cap=Math.max(1,...groups.map(x=>x.total));const topServices=Object.keys(V3_JOB_TYPES).map(t=>({label:V3_JOB_TYPES[t],total:state.reports.filter(r=>r.serviceType===t).length})).filter(x=>x.total).sort((a,b)=>b.total-a.total);$('#mainContent').innerHTML=heading('Indicadores del negocio','Visualiza la operación registrada, sin mezclar cotizaciones con cobros.')+`<div class="v3-summary"><div><small>Importe de reportes completados</small><strong>${money(tot)}</strong></div><div><small>Importe previsto de órdenes abiertas</small><strong>${money(orderForecast)}</strong></div><div><small>Servicios completados</small><strong>${completed.length}</strong></div></div><div class="v3-analytics-grid"><section class="panel"><div class="panel-head"><div><h2>Importe de servicios por mes</h2><p class="muted small">Reportes completados · últimos seis meses</p></div></div><div class="v3-bars">${groups.map(x=>`<div class="v3-bar-col"><span>${money(x.total)}</span><div class="v3-bar-track"><div class="v3-bar-fill" style="height:${Math.max(2,Math.round(x.total/cap*100))}%"></div></div><small>${escape(x.label)}</small></div>`).join('')}</div></section><section class="panel"><h2>Tipos de servicio</h2><div class="list-stack" style="margin-top:20px">${topServices.length?topServices.map(x=>`<div class="v3-list-title"><span>${escape(x.label)}</span><b>${x.total}</b></div>`).join(''):'<p class="muted">Todavía no hay reportes registrados.</p>'}</div><div class="note-strip" style="margin-top:24px">${icon('info')} Los importes son los anotados en reportes, <b>no dinero cobrado</b>. Para controlar caja real se necesitará registrar pagos y gastos.</div></section></div>`;}
function v3FormPage(kind,id=''){const map={order:['orders','Órden de trabajo','v3-new-order'],appointment:['appointments','Cita de servicio','v3-new-appointment'],staff:['staff','Integrante del equipo','v3-new-staff']};const [collection,title]=map[kind];const old=state[collection].find(x=>x.id===id);const d=old?{...old}:kind==='order'?v3OrderNew():kind==='appointment'?v3AppointmentNew():v3StaffNew();state.v3Draft={kind,data:d};setPage('v3Editor',title);let fields='';if(kind==='order'){fields=v3E('Folio','folio',d.folio,'text','readonly')+v3E('Cliente *','clientName',d.clientName,'text','required')+v3E('Teléfono','phone',d.phone,'tel')+v3E('Dirección','address',d.address)+v3Sel('Servicio','type',V3_JOB_TYPES,d.type)+v3E('Equipo / capacidad','equipment',d.equipment)+v3E('Número de serie','serial',d.serial)+v3E('Fecha de visita','date',d.date,'date','required')+v3E('Hora','time',d.time,'time','required')+v3TechSelect(d.assignedTo)+v3Sel('Prioridad','priority',{baja:'Baja',normal:'Normal',alta:'Alta',urgente:'Urgente'},d.priority)+v3Sel('Estado','status',V3_ORDER_STATES,d.status)+v3E('Importe previsto (MXN)','amount',d.amount,'number','min="0" step="0.01"')+v3TA('Trabajo solicitado','description',d.description)+v3TA('Notas internas','notes',d.notes);}else if(kind==='appointment'){fields=v3E('Cliente *','clientName',d.clientName,'text','required')+v3E('Teléfono','phone',d.phone,'tel')+v3E('Dirección','address',d.address)+v3Sel('Tipo de trabajo','type',V3_JOB_TYPES,d.type)+v3E('Fecha *','date',d.date,'date','required')+v3E('Hora *','time',d.time,'time','required')+v3E('Duración aproximada (min)','duration',d.duration,'number','min="15" step="15"')+v3TechSelect(d.assignedTo)+v3Sel('Estado','status',V3_APPT_STATES,d.status)+v3TA('Indicaciones','notes',d.notes);}else{fields=v3E('Nombre *','name',d.name,'text','required')+v3E('WhatsApp','phone',d.phone,'tel')+v3E('Especialidad','specialty',d.specialty)+v3Sel('Puesto','role',{'Técnico':'Técnico','Supervisor':'Supervisor','Coordinación':'Coordinación'},d.role)+v3Sel('Estado','active',{'true':'Activo','false':'Inactivo'},String(d.active!==false));}$('#mainContent').innerHTML=heading(old?'Editar '+title.toLowerCase():'Nuevo '+title.toLowerCase(),'Los cambios se guardan localmente en este dispositivo.',`<button class="btn" data-nav="${collection}">← Regresar</button>`)+`<section class="panel v3-edit-panel"><form id="v3Form" class="form-grid" autocomplete="on">${fields}</form><div class="section-actions v3-savebar"><button class="btn btn-ghost" data-nav="${collection}">Cancelar</button><button class="btn btn-primary" data-action="v3-save">${icon('check')} Guardar ${title.toLowerCase()}</button></div></section>`;}
async function v3Save(){const fd=new FormData($('#v3Form'));const d=state.v3Draft.data,kind=state.v3Draft.kind;for(const [k,v] of fd.entries())d[k]=String(v).trim();if(kind==='staff'){if(!d.name){toast('Escribe el nombre del técnico.');return;}d.active=d.active==='true';}else{if(!d.clientName){toast('Escribe el nombre del cliente.');return;}if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||!/^\d{2}:\d{2}$/.test(d.time)){toast('Selecciona una fecha y hora válidas.');return;}if(kind==='order'){d.amount=Number(d.amount);if(!Number.isFinite(d.amount)||d.amount<0){toast('El importe no puede ser negativo.');return;}}else{d.duration=Number(d.duration)||60;if(d.duration<15){toast('La duración debe ser al menos 15 minutos.');return;}}}d.updatedAt=new Date().toISOString();const collection=kind==='order'?'orders':kind==='appointment'?'appointments':'staff';try{await newRecordPut(collection,d);state[collection]=await newRecordAll(collection);toast('Guardado correctamente.');if(kind==='order')v3OrdersPage();else if(kind==='appointment'){state.v3CalendarMonth=d.date.slice(0,7);state.v3SelectedDay='';v3AppointmentsPage();}else v3StaffPage();}catch(e){console.error(e);toast('No se pudo guardar. Revisa el almacenamiento.');}}
async function v3Handle(a,b){const id=b.dataset.id;const m={ 'v3-new-order':()=>v3FormPage('order'),'v3-new-appointment':()=>v3FormPage('appointment'),'v3-new-staff':()=>v3FormPage('staff'),'v3-edit-order':()=>v3FormPage('order',id),'v3-edit-appointment':()=>v3FormPage('appointment',id),'v3-edit-staff':()=>v3FormPage('staff',id)};if(m[a]){m[a]();return;}if(a==='v3-save'){await v3Save();return;}if(a==='v3-month'){const [y,m]=state.v3CalendarMonth.split('-').map(Number);const next=new Date(y,m-1+Number(b.dataset.dir),1);state.v3CalendarMonth=nowISOFromDate(next).slice(0,7);state.v3SelectedDay='';v3AppointmentsPage();return;}if(a==='v3-today'){state.v3CalendarMonth=nowLocal().slice(0,7);state.v3SelectedDay=nowLocal();v3AppointmentsPage();return;}if(a==='v3-day'){state.v3SelectedDay=b.dataset.date;v3AppointmentsPage();return;}if(a==='v3-clear-day'){state.v3SelectedDay='';v3AppointmentsPage();return;}if(a==='v3-order-to-report'){const o=state.orders.find(x=>x.id===id);if(o)await startNew({clientName:o.clientName,clientPhone:o.phone,clientAddress:o.address,equipmentType:o.equipment,serial:o.serial,serviceType:o.type,technician:v3Name(o.assignedTo)==='Sin asignar'?'':v3Name(o.assignedTo),date:o.date,observations:`Orden ${o.folio}: ${o.description}\n${o.notes||''}`,price:String(o.amount||'')});return;}if(a==='v3-order-to-appointment'){const o=state.orders.find(x=>x.id===id);if(o)v3FormPage('appointment',''),Object.assign(state.v3Draft.data,{orderId:o.id,clientName:o.clientName,phone:o.phone,address:o.address,type:o.type,date:o.date,time:o.time,assignedTo:o.assignedTo,notes:o.description}),v3FormPagePrefilled(state.v3Draft.data);return;}const deletion={'v3-delete-order':['orders','orders',v3OrdersPage],'v3-delete-appointment':['appointments','appointments',v3AppointmentsPage],'v3-delete-staff':['staff','staff',v3StaffPage]}[a];if(deletion){const [key,col,page]=deletion;const item=state[key].find(x=>x.id===id);if(!item)return;if(!confirm(`¿Eliminar ${item.folio||item.clientName||item.name}? Esta acción no se puede deshacer.`))return;await newRecordDel(col,id);state[key]=await newRecordAll(col);page();toast('Registro eliminado.');}}

function boot(){
 // Actualiza el Service Worker incluso cuando la base de datos de la v1 esté bloqueada.
 if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
   navigator.serviceWorker.register('./sw.js').catch(()=>{});
 }
 const watchdog=setTimeout(()=>{
   const main=$('#mainContent');
   if(main&&main.textContent.includes('Iniciando A&C Service Pro')){
     main.innerHTML=`<section class="empty-state"><h3>La aplicación sigue iniciando</h3><p>Es posible que otra pestaña de la versión anterior esté bloqueando la actualización. Cierra las otras pestañas de A&C Service Pro y toca Reintentar. No borres los datos de Chrome.</p><button class="btn btn-primary" data-action="retry-startup">Reintentar inicio</button></section>`;
   }
 },7000);
 STORE.initialize().then(async()=>{
   state.reports=await STORE.all();sortReports();
   state.company={...DEFAULT_COMPANY,...(await STORE.getPref('company')||{})};
   state.quotes=await newRecordAll('quotes');
   state.inventory=await newRecordAll('inventory');
   await v3Load();
   state.quoteDraft=await STORE.getPref('quoteDraft');
   const old=await STORE.getPref('draft');
   if(old&&old.id&&!state.reports.some(r=>r.id===old.id)){
     state.draft=old;toast('Tienes un borrador disponible desde «Nuevo».');
   }else if(old&&old.id){state.draft=old;}
   clearTimeout(watchdog);
   dashboard();
 }).catch(e=>{
   clearTimeout(watchdog);
   const main=$('#mainContent');
   if(main)main.innerHTML=`<section class="empty-state"><h3>No fue posible iniciar el almacenamiento</h3><p>${escape(e.message)}</p><p>No borres los datos guardados. Cierra otras pestañas de la app e inténtalo de nuevo.</p><button class="btn btn-primary" data-action="retry-startup">Reintentar inicio</button></section>`;
 });
}
window.addEventListener('click',async(e)=>{const nav=e.target.closest('[data-nav]');if(nav){const page=nav.dataset.nav;if(page==='dashboard')dashboard();else if(page==='reports')reportsPage();else if(page==='clients')clientsPage();else if(page==='settings')settingsPage();else if(page==='appointments')v3AppointmentsPage();else if(page==='orders')v3OrdersPage();else if(page==='analytics')v3AnalyticsPage();else if(page==='staff')v3StaffPage();else if(page==='quotes')quotesPage();else if(page==='inventory')inventoryPage();else if(page==='equipment')equipmentPage();else if(page==='diagnostics')diagnosticsPage();else if(page==='tools')toolsPage();else if(page==='editor'){if(state.draft)editor(true);else startNew();}return;}
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a.startsWith('v3-')){try{await v3Handle(a,b);}catch(err){console.error(err);toast('No se pudo completar la operación.');}return;}switch(a){
 case 'retry-startup':location.reload();break;
 case 'new-report':await startNew();break;
 case 'cancel-editor':await persistNow();dashboard();break;
 case 'preview':state.selectedId=id;preview();break;
 case 'edit':openEditor(id);break;
 case 'save-report':await saveReport(false);break;
 case 'save-draft':await persistNow();toast('Borrador guardado en este dispositivo.');break;
 case 'delete':{const r=state.reports.find(x=>x.id===id);if(r&&confirm(`¿Eliminar definitivamente ${r.folio} de ${r.clientName}? Haz un respaldo antes si lo necesitas.`)){await STORE.remove(id);state.reports=await STORE.all();sortReports();reportsPage();toast('Reporte eliminado.');}break;}
 case 'filter':state.statusFilter=b.dataset.filter;reportsPage();break;
 case 'complete-tasks':state.draft.tasks.forEach(t=>t.done=true);$('#checklistHolder').innerHTML=checklistHTML();refreshSummary();scheduleDraft();break;
 case 'add-task':{const inp=$('#customCheckInput'),label=inp.value.trim();if(label){state.draft.tasks.push({label,done:false});$('#checklistHolder').innerHTML=checklistHTML();refreshSummary();scheduleDraft();}break;}
 case 'remove-task':state.draft.tasks.splice(Number(b.dataset.index),1);$('#checklistHolder').innerHTML=checklistHTML();refreshSummary();scheduleDraft();break;
 case 'remove-photo':state.draft.photos.splice(Number(b.dataset.index),1);$('#photosHolder').innerHTML=photosHTML();refreshSummary();scheduleDraft();break;
 case 'clear-signature':state.draft.signature='';const c=$('#signatureCanvas');c?.getContext('2d').clearRect(0,0,c.width,c.height);scheduleDraft();toast('Firma borrada.');break;
 case 'print':await printReport(id);break;
 case 'share':{const r=state.reports.find(x=>x.id===id);if(!r)return;const msg=`${state.company.name}\nReporte: ${r.folio}\nCliente: ${r.clientName}\nServicio: ${SERVICE_LABELS[r.serviceType]||'Servicio'}\nFecha: ${dateDisplay(r.date)}\nEstado: ${r.status}\nImporte: ${money(r.price)}\n(Este mensaje es un resumen; el reporte PDF se envía por separado.)`;const phone=(r.clientPhone||'').replace(/\D/g,'');const numero=phone.length===10?'52'+phone:phone;window.open(`https://wa.me/${numero||''}?text=${encodeURIComponent(msg)}`,'_blank','noopener');break;}
 case 'save-settings':await STORE.setPref('company',state.company);toast('Configuración guardada.');dashboard();break;
 case 'reset-logo':state.company.logo='';const l=$('#settingsLogo');if(l)l.src=DEFAULT_ICON;toast('Se restauró el logo provisional. Guarda los ajustes.');break;

 case 'csv':exportCSV();break;
 case 'new-for-client':{const c=state.clientMap?.get(b.dataset.client);await startNew({clientName:c?.name||'',clientPhone:c?.phone||'',clientAddress:c?.address||''});break;}
 }});
window.addEventListener('input',(e)=>{const t=e.target;if(t.id==='reportSearch'){state.search=t.value;updateReportResults();return;}if(t.id==='clientSearch'){state.clientSearch=t.value;clientsPage();$('#clientSearch')?.focus();$('#clientSearch')?.setSelectionRange(t.value.length,t.value.length);return;}if(t.dataset.field&&t.dataset.field!=='serviceType'&&state.draft){state.draft[t.dataset.field]=t.value;refreshSummary();scheduleDraft();return;}if(t.dataset.metric&&state.draft){state.draft.measurements[t.dataset.metric]=t.value;refreshSummary();scheduleDraft();return;}if(t.dataset.photocaption!==undefined&&state.draft){const p=state.draft.photos[Number(t.dataset.photocaption)];if(p){p.caption=t.value;scheduleDraft();}return;}if(t.dataset.setting){state.company[t.dataset.setting]=t.value;return;}});
window.addEventListener('change',async(e)=>{const t=e.target;if(t.dataset.check!==undefined&&state.draft){const item=state.draft.tasks[Number(t.dataset.check)];if(item){item.done=t.checked;$('#checklistHolder').innerHTML=checklistHTML();refreshSummary();scheduleDraft();}return;}if(t.dataset.field==='serviceType'&&state.draft){const value=t.value;if(state.draft.tasks.some(x=>x.done)&&!confirm('¿Cambiar la lista de actividades? Se sustituirá el checklist anterior.')){t.value=state.draft.serviceType;return;}state.draft.serviceType=value;state.draft.tasks=(TEMPLATES[value]||TEMPLATES.otro).map(label=>({label,done:false}));$('#checklistHolder').innerHTML=checklistHTML();refreshSummary();scheduleDraft();return;}if(t.id==='photosInput'&&state.draft){await addPhotos(t.files);return;}if(t.id==='importInput'){await importBackup(t.files?.[0]);return;}if(t.id==='logoInput'&&t.files?.[0]){try{state.company.logo=await compressImage(t.files[0],500,.87);$('#settingsLogo').src=state.company.logo;toast('Logo cargado. Guarda la configuración.');}catch(e){toast('No se pudo procesar el logotipo.');}return;}});
window.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&e.target.id==='customCheckInput'){e.preventDefault();$('#customCheckInput').closest('.check-add').querySelector('[data-action="add-task"]').click();}});
window.addEventListener('beforeunload',()=>{if(state.page==='editor'&&state.draft){/* Se guarda automáticamente durante el uso; antes de salir no se garantiza escritura asíncrona. */}});
boot();
})();
</script>
</body>
</html>
