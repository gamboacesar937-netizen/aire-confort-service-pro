<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081426">
  <meta name="description" content="Aire Acondicionado y Confort: reportes de servicio HVAC con respaldo fotográfico, firmas y control de clientes. Funciona sin conexión.">
  <meta name="application-name" content="A&C Service Pro">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>A&C Service Pro · Aire Acondicionado y Confort</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-box">
        <div class="logo-wrapper"><img src="assets/icon.svg" alt="Logo A&C"></div>
        <div class="brand-name"><strong>AIRE & CONFORT</strong><span>SERVICE PRO <b>1.0</b></span></div>
      </div>
      <div class="side-caption">OPERACIONES</div>
      <nav class="side-nav" aria-label="Menú principal" id="desktopNav"></nav>
      <div class="side-spacer"></div>
      <div class="side-bottom"><span class="connection-dot"></span> <span>Datos guardados en este dispositivo</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="top-heading"><div class="crumb">A&C / <span id="crumbCurrent">Panel general</span></div><div class="top-title" id="topTitle">Panel de control</div></div>
        <div class="top-right"><span class="offline-chip" title="Funciona sin internet"><span class="connection-dot"></span> Modo local</span><button class="btn btn-primary top-create" data-action="new-report"><span>＋</span> Nuevo reporte</button></div>
      </header>
      <main class="main-content" id="mainContent"><div class="loading">Iniciando A&C Service Pro…</div></main>
    </div>
    <nav class="mobile-nav" aria-label="Navegación inferior" id="mobileNav"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="printArea" aria-hidden="true"></div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
