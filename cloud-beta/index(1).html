const cfg={...originalCfg,supabaseUrl:String(originalCfg.supabaseUrl||'').trim(),supabasePublishableKey:(publicKeyOverride||String(originalCfg.supabasePublishableKey||'')).trim()};
const PUB_RE=/^sb_publishable_[A-Za-z0-9_-]{16,}$/;
const configured=/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(cfg.supabaseUrl||'')&&typeof cfg.supabasePublishableKey==='string'&&cfg.supabasePublishableKey.length>25;
const state={demo:false,api:null,session:null,org:null,role:null,tab:'home',editing:null,records:{customers:[],jobs:[],appointments:[],quotes:[]},busy:false};
const MAP={customers:'ac_customers',jobs:'ac_jobs',appointments:'ac_appointments',quotes:'ac_quotes'};
const NAV=[['home','⌂','Inicio'],['customers','♙','Clientes'],['jobs','▤','Órdenes'],['appointments','▦','Agenda'],['quotes','▣','Cotizaciones']];
const SAMPLE_CUSTOMERS=[{id:'c1',name:'Cliente de demostración',phone:'',email:'',address:'Guadalajara, Jalisco',notes:''}];
const SAMPLE_JOBS=[{id:'j1',customer_id:'c1',title:'Mantenimiento minisplit 1 TR',service_date:'2026-11-28',technician:'Técnico de muestra',status:'programado',amount_mxn:990,notes:'Ejemplo sin datos reales'}];
const SAMPLE_APPTS=[{id:'a1',customer_id:'c1',starts_at:'2026-11-28T17:00:00.000Z',duration_minutes:90,status:'programada',description:'Visita de muestra'}];
const SAMPLE_QUOTES=[{id:'q1',customer_id:'c1',folio:'DEMO-001',concept:'Mantenimiento preventivo minisplit',amount_mxn:1100,status:'borrador',valid_until:'2026-12-08',created_at:'2026-11-23T18:00:00Z'}];
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(v)||0);
const dateText=d=>d?new Date(`${String(d).slice(0,10)}T12:00:00`).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}):'Sin fecha';
const dateTimeText=d=>d?new Date(d).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}):'Sin fecha';
const toLocalField=iso=>{if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const datePlus15=()=>{const d=new Date();d.setDate(d.getDate()+15);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

const field=(label,name,value='',type='text',required=false,extra='')=>`<div class="field ${extra}"><label for="fld_${name}">${escapeHtml(label)}${required?' *':''}</label><input id="fld_${name}" name="${name}" type="${type}" value="${escapeHtml(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''} maxlength="500"></div>`;
const textarea=(label,name,value='')=>`<div class="field full"><label for="fld_${name}">${escapeHtml(label)}</label><textarea name="${name}" id="fld_${name}" maxlength="2000">${escapeHtml(value)}</textarea></div>`;
const select=(label,name,options,value)=>`<div class="field"><label>${escapeHtml(label)}</label><select name="${name}" required>${options.map(([v,t])=>`<option value="${escapeHtml(v)}" ${String(value)===String(v)?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select></div>`;

const cleanError=(e)=>{const msg=e?.message||'Ocurrió un error';if(isInvalidKeyError(msg))return 'Supabase rechazó la clave pública. Pulsa «¿Error de clave API? Reparar conexión». ';if(/foreign key|violates foreign key/i.test(msg))return'Este cliente está vinculado con otro registro. No se puede eliminar.';if(/row-level security|permission denied/i.test(msg))return'Acceso denegado por las políticas de seguridad. Comprueba los permisos.';return String(msg).slice(0,220)};

function showKeyRepair(detail='La aplicación no logró autenticar la clave actual.'){
  root(`<div class="auth-wrap"><div class="auth-card"><div class="auth-mark">A&C CLOUD · REPARACIÓN DE CONEXIÓN</div><h1>Vamos a corregir el acceso</h1><p>${escapeHtml(detail)}</p>${note('Usa ÚNICAMENTE la clave publicable que comienza con sb_publishable_. Nunca pegues una clave secreta, una contraseña o un token.',true)}<form id="keyRepairForm"><div class="field"><label for="repairKey">Clave publicable de Supabase</label><input id="repairKey" name="publishable_key" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" required placeholder="sb_publishable_…"></div><button class="btn primary" type="submit">Comprobar y reparar conexión</button></form><p class="foot-note">Si se acepta, se guardará solamente en este navegador para pruebas. Tu config.js en GitHub no cambia.</p><div class="btn-row">${button('Volver a iniciar sesión','show-login','ghost')}${button('Ver demostración','demo','ghost')}</div></div></div>`);

async function validatePublicKey(key){
 const url=String(cfg.supabaseUrl||'').replace(/\/+$/,'');
 if(!PUB_RE.test(key))throw Error('El formato no coincide con una clave publicable. Cópiala completa desde Supabase.');
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),14000);
 try{
  // /auth/v1/user exige sesión de usuario. Un 401 de "sesión ausente" es normal;
  // en cambio "Invalid API key" indica que la plataforma rechazó la clave.
  const r=await fetch(url+'/auth/v1/user',{headers:{'apikey':key,'accept':'application/json'},cache:'no-store',signal:c.signal});
  const body=await r.text();
  let parsed={};try{parsed=JSON.parse(body)}catch{}
  const err=String(parsed.msg||parsed.message||parsed.error_description||parsed.error||'');
  if(/invalid api key|api key is invalid|invalid apikey|no api key found/i.test(err))throw Error('Supabase rechazó la clave publicable (HTTP '+r.status+'). Cópiala directamente desde Configuración → Claves API.');
  if(r.status===404||r.status>=500)throw Error('Supabase no respondió correctamente (HTTP '+r.status+').');
  if(r.status!==200&&r.status!==401&&r.status!==403)throw Error('La comprobación devolvió HTTP '+r.status+': '+err.slice(0,120));
  return true;
 }finally{clearTimeout(timer)}
}
async function rawAuthRequest(mode,email,password){
 const url=String(cfg.supabaseUrl||'').replace(/\/+$/,'');
 const key=cfg.supabasePublishableKey;
 const path=mode==='register'?'/auth/v1/signup':mode==='reset'?'/auth/v1/recover':'/auth/v1/token?grant_type=password';
 const payload=mode==='reset'?{email}:{email,password};
 const r=await fetch(url+path,{method:'POST',headers:{'apikey':key,'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
 let data={};try{data=await r.json()}catch{}
 if(!r.ok){const error=new Error(String(data.msg||data.error_description||data.message||data.error||'Error HTTP '+r.status));error.status=r.status;throw error}
 return data;
}
function showAuth(mode='login'){const register=mode==='register',reset=mode==='reset';root(`<div class="auth-wrap"><div class="auth-card"><div class="auth-mark">A&C SERVICE PRO · CLOUD BETA</div><h1>${reset?'Recuperar contraseña':register?'Crear cuenta':'Iniciar sesión'}</h1><p>La información de cada empresa se consulta únicamente tras iniciar sesión.</p><form id="authForm" data-mode="${mode}"><div class="field"><label>Correo electrónico</label><input name="email" type="email" required autocomplete="email" placeholder="correo@empresa.com"></div>${reset?'':`<div class="field"><label>Contraseña (mínimo 8 caracteres)</label><input name="password" type="password" required minlength="8" autocomplete="${register?'new-password':'current-password'}"></div>`}<button class="btn primary" type="submit">${reset?'Enviar enlace':register?'Registrarme':'Entrar'}</button></form><div class="btn-row" style="justify-content:space-between;margin-top:15px"><button class="link-button" data-action="${register?'show-login':'show-register'}">${register?'Ya tengo cuenta':'Crear cuenta'}</button><button class="link-button" data-action="${reset?'show-login':'show-reset'}">${reset?'Volver a entrar':'Olvidé mi contraseña'}</button></div><p class="foot-note">No compartas tu contraseña ni subas tokens secretos a GitHub.</p><button class="link-button" data-action="repair-key" style="margin-top:10px">¿Error de clave API? Reparar conexión</button></div></div>`)}

function render(){if(!state.org)return;const nav=()=>NAV.map(([k,icon,label])=>`<button data-tab="${k}" class="${state.tab===k?'active':''}"><span>${icon}</span>${label}</button>`).join('');const sub={home:'Panel de control',customers:'Clientes',jobs:'Órdenes de trabajo',appointments:'Agenda',quotes:'Cotizaciones'};root(`<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">❄</div><div><div class="brand-title">A&C SERVICE PRO</div><div class="brand-sub">CLOUD · BETA 0.1</div></div></div><div class="small-label">OPERACIONES</div><nav class="nav">${nav()}</nav><div class="sidebar-bottom">${escapeHtml(state.org.name)}<br>${state.demo?'DEMO · sin guardar':state.role==='owner'?'Propietario · datos en Supabase':'Técnico · solo lectura'}<div style="margin-top:10px">${button(state.demo?'Salir de demo':'Cerrar sesión',state.demo?'exit-demo':'logout','ghost')}</div></div></aside><main class="main"><header class="top"><div><div class="eyebrow">A&C / ${state.demo?'DEMOSTRACIÓN':'ESPACIO EMPRESARIAL'}</div><h1>${sub[state.tab]||'Panel de control'}</h1></div><div class="pill">${escapeHtml(state.org.name)}</div></header><div class="content">${state.demo?note('Modo demostración: usa información de ejemplo. No hay cuentas, sincronización ni guardado.',true):''}${screen()}</div></main><nav class="bottom-nav">${NAV.map(([k,i,l])=>`<button class="${state.tab===k?'active':''}" data-tab="${k}"><b>${i}</b>${l}</button>`).join('')}</nav></div>`)}

function listPage(kind){const labels={customers:['Clientes','Registra a quién atiendes y dónde.'],jobs:['Órdenes de trabajo','Servicios y sus avances.'],appointments:['Agenda de visitas','Programa y consulta próximos servicios.'],quotes:['Cotizaciones','Presupuestos con vigencia de 15 días.']};const [title,desc]=labels[kind];const canAdd=!state.demo&&owner()&&(!['jobs','appointments','quotes'].includes(kind)||state.records.customers.length);return `<div class="section-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="btn-row">${canAdd?`<button class="btn primary" data-action="new-${kind}">＋ Nuevo</button>`:''}${!state.demo?button('Exportar JSON','export','ghost'):''}</div></div>${!canAdd&&owner()&&kind!=='customers'?note('Registra primero un cliente para poder crear este tipo de registro.'):''}${state.editing?.kind===kind?editForm(kind,state.editing.id):''}<section class="panel"><div class="list-wrap">${rowTable(kind)}</div></section><p class="foot-note">Solo el propietario puede modificar datos en esta beta. El directorio de técnicos vendrá en otra fase.</p>`}
function rowTable(kind){const rows=state.records[kind];if(!rows.length)return `<div class="empty">Aún no hay registros. Usa el botón «Nuevo» para empezar.</div>`;const th={customers:['Cliente','Contacto','Dirección','Acciones'],jobs:['Orden','Cliente','Estado / fecha','Importe','Acciones'],appointments:['Visita','Cliente','Estado','Acciones'],quotes:['Folio','Cliente','Importe / vigencia','Acciones']}[kind];const c=v=>escapeHtml(v);return `<table class="list"><thead><tr>${th.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>{let cells=[];if(kind==='customers')cells=[`<strong>${c(r.name)}</strong>`,`<div>${c(r.phone||'—')}</div><small>${c(r.email||'')}</small>`,c(r.address||'—')];if(kind==='jobs')cells=[`<strong>${c(r.title)}</strong><br><small>${c(r.technician||'Sin asignar')}</small>`,c(recordName(r.customer_id)),`<span class="tag ${r.status==='completado'?'good':''}">${c(r.status.replaceAll('_',' '))}</span><br><small>${dateText(r.service_date)}</small>`,money(r.amount_mxn)];if(kind==='appointments')cells=[`<strong>${dateTimeText(r.starts_at)}</strong><br><small>${c(r.description)}</small>`,c(recordName(r.customer_id)),`<span class="tag">${c(r.status)}</span>`];if(kind==='quotes')cells=[`<strong>${c(r.folio)}</strong><br><small>${c(r.concept)}</small>`,c(recordName(r.customer_id)),`${money(r.amount_mxn)}<br><small>Hasta ${dateText(r.valid_until)}</small>`];const actions=`<div class="inline-actions">${kind==='quotes'?`<button class="btn" data-action="print-quote" data-id="${c(r.id)}">PDF</button>`:''}${owner()&&!state.demo?`<button class="btn" data-action="edit-${kind}" data-id="${c(r.id)}">Editar</button><button class="btn danger" data-action="delete-${kind}" data-id="${c(r.id)}">×</button>`:''}</div>`;return `<tr>${[...cells,actions].map(x=>`<td>${x}</td>`).join('')}</tr>`}).join('')}</tbody></table>`}
function editForm(kind,id){const r=state.records[kind].find(x=>x.id===id)||{};let form='';if(kind==='customers')form=field('Nombre','name',r.name,'text',true)+field('Teléfono / WhatsApp','phone',r.phone,'tel')+field('Correo','email',r.email,'email')+field('Dirección','address',r.address)+textarea('Notas','notes',r.notes);

if(kind==='quotes')form=customerOpts(r.customer_id)+field('Folio','folio',r.folio||`AYC-${Date.now().toString().slice(-8)}`,'text',true)+field('Concepto','concept',r.concept,'text',true)+field('Importe (MXN)','amount_mxn',r.amount_mxn||0,'number',true)+field('Vigencia hasta','valid_until',r.valid_until||datePlus15(),'date',true)+select('Estado','status',statuses.quotes,r.status||'borrador');

async function authenticate(fd,mode){
 if(!state.api)throw Error('Falta configurar Supabase');
 const email=String(fd.get('email')||'').trim(),password=String(fd.get('password')||'');
 let res;
 if(mode==='reset')res=await state.api.auth.resetPasswordForEmail(email,{redirectTo:location.href});
 else if(mode==='register')res=await state.api.auth.signUp({email,password});
 else res=await state.api.auth.signInWithPassword({email,password});
 if(res.error&&isInvalidKeyError(res.error)){
   // Contingencia para fallos de compatibilidad SDK/API: llamada sin Bearer inválido.
   try{
     const raw=await rawAuthRequest(mode,email,password);
     if(mode==='reset'){toast('Si el correo está registrado, recibirás instrucciones.');showAuth('login');return}
     const access=raw.access_token||raw.session?.access_token;
     const refresh=raw.refresh_token||raw.session?.refresh_token;
     if(access&&refresh){const set=await state.api.auth.setSession({access_token:access,refresh_token:refresh});if(set.error)throw set.error;await readContext();return}
     if(mode==='register'){toast('Revisa tu correo para confirmar el registro.');showAuth('login');return}
     throw Error('Auth respondió sin datos de sesión. Comprueba correo y contraseña.');
   }catch(e){
     if(isInvalidKeyError(e)){
       showKeyRepair('Supabase rechazó la clave también al intentar el registro directamente. Copia una nueva clave publicable desde el panel de Supabase.');
       toast('La clave actual fue rechazada por Auth.');return;
     }
     throw e;
   }
 }
 if(res.error)throw res.error;
 if(mode==='reset'){toast('Si el correo está registrado, recibirás instrucciones.');showAuth('login');return}
 if(mode==='register'&&!res.data.session){toast('Cuenta creada. Confirma tu correo y luego inicia sesión.');showAuth('login');return}
 await readContext();
}
async function readContext(){if(!state.api)return;const {data:{session},error}=await state.api.auth.getSession();if(error)throw error;state.session=session;if(!session){state.org=null;showAuth();return}const m=await state.api.from('ac_members').select('organization_id,role').eq('user_id',session.user.id);if(m.error)throw m.error;if(!m.data?.length){state.org=null;showCreateOrg();return}const ids=m.data.map(x=>x.organization_id);const o=await state.api.from('ac_organizations').select('id,name').in('id',ids);if(o.error)throw o.error;state.org=o.data?.[0]||null;if(!state.org){showCreateOrg();return}state.role=m.data.find(x=>x.organization_id===state.org.id)?.role||'technician';await loadData();state.tab='home';render()}
async function loadData(){const ks=Object.keys(MAP);const out=await Promise.all(ks.map(async k=>{const res=await state.api.from(MAP[k]).select('*').eq('organization_id',state.org.id).limit(1000);if(res.error)throw res.error;return[k,res.data||[]]}));for(const[k,rows]of out)state.records[k]=rows}
async function save(kind,id,fd){if(state.demo||!owner())throw Error('Sin permisos para guardar');const values=Object.fromEntries(fd.entries());const data={organization_id:state.org.id};if(kind==='customers')Object.assign(data,{name:String(values.name||'').trim(),phone:values.phone||'',email:values.email||'',address:values.address||'',notes:values.notes||''});if(kind==='jobs')Object.assign(data,{customer_id:values.customer_id,title:values.title.trim(),status:values.status,service_date:values.service_date||null,technician:values.technician||'',amount_mxn:Number(values.amount_mxn)||0,notes:values.notes||''});if(kind==='appointments'){const d=new Date(values.starts_at);if(Number.isNaN(+d))throw Error('Fecha inválida');Object.assign(data,{customer_id:values.customer_id,starts_at:d.toISOString(),duration_minutes:Number(values.duration_minutes)||60,status:values.status,description:values.description||''})}if(kind==='quotes')Object.assign(data,{customer_id:values.customer_id,folio:values.folio.trim(),concept:values.concept.trim(),amount_mxn:Number(values.amount_mxn)||0,status:values.status,valid_until:values.valid_until});if('amount_mxn'in data&&(!Number.isFinite(data.amount_mxn)||data.amount_mxn<0))throw Error('Importe inválido');let res;if(id)res=await state.api.from(MAP[kind]).update(data).eq('id',id).eq('organization_id',state.org.id).select('id');else res=await state.api.from(MAP[kind]).insert(data).select('id');if(res.error)throw res.error;if(id&&(!res.data||res.data.length===0))throw Error('No se actualizó el registro: comprueba permisos');await loadData();state.editing=null;render();toast(id?'Cambios guardados':'Registro creado correctamente')}
async function remove(kind,id){if(!owner()||state.demo)return;if(!confirm('¿Eliminar este registro? No se puede deshacer.'))return;const r=await state.api.from(MAP[kind]).delete().eq('id',id).eq('organization_id',state.org.id).select('id');if(r.error)throw r.error;if(!r.data?.length)throw Error('No se eliminó el registro');await loadData();render();toast('Registro eliminado')}
function exportData(){if(state.demo)return;const payload={app:'AC Service Pro Cloud Beta',version:1,created_at:new Date().toISOString(),organization:state.org.name,records:state.records};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`AYC-CLOUD-respaldo-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),600);toast('Respaldo exportado; guárdalo en un lugar privado')}
function printQuote(id){const q=state.records.quotes.find(x=>x.id===id);if(!q)return;const c=state.records.customers.find(x=>x.id===q.customer_id);$('#printArea').innerHTML=`<div style="font-family:Arial,sans-serif;max-width:760px;margin:auto;padding:24px;"><p style="color:#2183b8;font-weight:bold">AIRE ACONDICIONADO Y CONFORT · A&C SERVICE PRO</p><h1>COTIZACIÓN ${escapeHtml(q.folio)}</h1><p><strong>Empresa:</strong> ${escapeHtml(state.org.name)}</p><p><strong>Cliente:</strong> ${escapeHtml(c?.name||'')}<br><strong>Contacto:</strong> ${escapeHtml(c?.phone||'')}<br><strong>Fecha:</strong> ${dateText(q.created_at)}<br><strong>Vigencia:</strong> ${dateText(q.valid_until)}</p><table><tr><td><strong>Concepto</strong></td><td><strong>Importe</strong></td></tr><tr><td>${escapeHtml(q.concept)}</td><td>${money(q.amount_mxn)}</td></tr></table><h2 style="text-align:right">Total: ${money(q.amount_mxn)}</h2><p>Vigencia indicada arriba. Precios expresados en MXN. Documento informativo, no es factura.</p><p>Gracias por tu preferencia.</p></div>`;window.print()}
async function runAction(b){const act=b.dataset.action,id=b.dataset.id||'';if(act==='repair-key'){showKeyRepair();return}if(act==='demo'){showDemo();return}if(act==='exit-demo'){state.demo=false;state.org=null;showSetup();return}if(act==='show-login'||act==='show-register'||act==='show-reset'){showAuth(act.slice(5));return}if(act==='logout'){await state.api.auth.signOut();state.org=null;showAuth();return}if(act==='cancel-edit'){state.editing=null;render();return}if(act==='export'){exportData();return}if(act==='print-quote'){printQuote(id);return}const nm=act.match(/^(new|edit|delete)-(customers|jobs|appointments|quotes)$/);if(!nm)return;const[,verb,kind]=nm;if(verb==='delete'){await remove(kind,id);return}if(!owner()||state.demo)return;state.tab=kind;state.editing={kind,id:verb==='edit'?id:''};render();const f=$('#recordForm');if(f)f.scrollIntoView({block:'start',behavior:'smooth'})}
document.addEventListener('click',async e=>{const n=e.target.closest('[data-tab]');if(n){state.tab=n.dataset.tab;state.editing=null;render();return}const b=e.target.closest('[data-action]');if(b)try{await runAction(b)}catch(err){toast(cleanError(err))}});
document.addEventListener('submit',async e=>{if(!['authForm','orgForm','recordForm','keyRepairForm'].includes(e.target.id))return;e.preventDefault();const form=e.target,submit=form.querySelector('[type=submit]'),fd=new FormData(form);if(submit)submit.disabled=true;try{if(form.id==='keyRepairForm'){const pub=String(fd.get('publishable_key')||'').trim();await validatePublicKey(pub);try{localStorage.setItem(OVERRIDE_KEY,pub)}catch{throw Error('El navegador no permitió guardar la configuración. Prueba Chrome normal.')}toast('Clave aceptada para la prueba. Recargando...');location.reload();return}else if(form.id==='authForm')await authenticate(fd,form.dataset.mode);else if(form.id==='orgForm'){const res=await state.api.rpc('ac_create_organization',{p_name:String(fd.get('name')||'').trim()});if(res.error)throw res.error;await readContext();toast('Empresa creada correctamente')}else if(form.id==='recordForm')await save(form.dataset.kind,form.dataset.id,fd)}catch(err){toast(cleanError(err))}finally{if(submit?.isConnected)submit.disabled=false}});
(async function boot(){if(!configured){showSetup();return}if(!window.supabase?.createClient){root(`<div class="auth-wrap"><div class="auth-card"><h1>Sin conexión con la librería</h1><p>Comprueba internet y el acceso al CDN de Supabase. No se ha accedido a tus datos.</p>${button('Ver demo','demo','primary')}</div></div>`);return}try{state.api=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});state.api.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'&&!state.demo){state.session=null;state.org=null;state.records={customers:[],jobs:[],appointments:[],quotes:[]};showAuth()}});await readContext()}catch(e){root(`<div class="auth-wrap"><div class="auth-card"><h1>No se pudo iniciar A&C Cloud</h1><p>${escapeHtml(cleanError(e))}</p>${note('Comprueba que ejecutaste el SQL, configuraste URL y publishable key y habilitaste autenticación por correo.',true)}<div class="btn-row">${button('Ver demo','demo','primary')}${button('Reintentar','retry','ghost')}</div></div></div>`)}})();
document.addEventListener('click',e=>{if(e.target.closest('[data-action="retry"]'))location.reload()});
})();

</script>
</body>
